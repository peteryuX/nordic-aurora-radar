name: Aurora Radar CI & Live API Check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all ES modules, SW & test scripts
        run: for f in src/*.js sw.js tests/*.mjs; do node --check "$f"; done
      - name: Run automated physics, chaos, nowcast, storage, glossary, SVG fuzz & security tests
        run: node --test tests/aurora.test.mjs
      - name: Run systematic 16-invariant number-to-copy & cross-card semantic contract suite
        run: node tests/copy-contract.mjs
      - name: Run quantitative calibration (72 storms) & NASA JPL DE441 (22 checkpoints) benchmark
        run: node tests/benchmark.mjs
      - name: Run 18-case real-iPhone viewport, scroll-bleed, flex-spillover, multi-font (14px-28px), EN & red-mode UI QA gate
        run: node tests/ui-qa.mjs
      - name: Run real-app end-to-end headless browser semantic & global-region regression suite
        run: node tests/e2e-real-app.mjs

  live-api-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run live NOAA + MET Norway + Open-Meteo end-to-end smoke test
        run: LIVE_TEST=1 node --test tests/aurora.test.mjs
      - name: Run live multi-source cross-validation benchmark
        run: LIVE_TEST=1 node tests/benchmark.mjs
      - name: Run independent public-data out-of-sample audit (NASA OMNI2, GFZ Hp30, NOAA Prop, 9 Airport METARs)
        run: node tests/realworld-validation.mjs
